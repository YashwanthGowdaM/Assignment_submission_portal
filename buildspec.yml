version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    AWS_ACCOUNT_ID: "003344631245"

    BACKEND_REPO_NAME: assignment-portal-backend
    FRONTEND_REPO_NAME: assignment-portal-frontend

    IMAGE_TAG: latest

phases:

  install:
    commands:
      - echo "==========================================="
      - echo "INSTALL PHASE"
      - echo "==========================================="
      - docker --version
      - aws --version

  pre_build:
    commands:
      - echo "==========================================="
      - echo "Logging into Amazon ECR"
      - echo "==========================================="

      - ACCOUNT_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ACCOUNT_URI

      - BACKEND_IMAGE_URI=$ACCOUNT_URI/$BACKEND_REPO_NAME
      - FRONTEND_IMAGE_URI=$ACCOUNT_URI/$FRONTEND_REPO_NAME

      - echo Backend_Image_URI=$BACKEND_IMAGE_URI
      - echo Frontend_Image_URI=$FRONTEND_IMAGE_URI

      - echo "==========================================="
      - echo "Repository Contents"
      - echo "==========================================="
      - pwd
      - ls -la
      - ls -la backend
      - ls -la frontend

  build:
    commands:
      - echo "==========================================="
      - echo "Building Backend Docker Image"
      - echo "==========================================="

      - docker build -f backend/Dockerfile -t $BACKEND_REPO_NAME:$IMAGE_TAG .

      - docker tag $BACKEND_REPO_NAME:$IMAGE_TAG $BACKEND_IMAGE_URI:$IMAGE_TAG

      - echo "==========================================="
      - echo "Building Frontend Docker Image"
      - echo "==========================================="

      - docker build -f frontend/Dockerfile -t $FRONTEND_REPO_NAME:$IMAGE_TAG ./frontend

      - docker tag $FRONTEND_REPO_NAME:$IMAGE_TAG $FRONTEND_IMAGE_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo "==========================================="
      - echo "Pushing Backend Image"
      - echo "==========================================="

      - docker push $BACKEND_IMAGE_URI:$IMAGE_TAG

      - echo "==========================================="
      - echo "Pushing Frontend Image"
      - echo "==========================================="

      - docker push $FRONTEND_IMAGE_URI:$IMAGE_TAG
      
      - echo "==========================================="
      - echo "Deploying to EC2"
      - echo "==========================================="
      - |
        aws ssm send-command \
          --instance-ids "i-00971a39f29e012d9" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy latest containers" \
          --parameters 'commands=[
            "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 003344631245.dkr.ecr.us-east-1.amazonaws.com",
            "docker pull 003344631245.dkr.ecr.us-east-1.amazonaws.com/assignment-portal-backend:latest",
            "docker stop assignment-backend || true",
            "docker rm assignment-backend || true",
            "docker run -d --name assignment-backend --network assignment-net --restart unless-stopped -p 5000:5000 -e DATABASE_URL=\"$DATABASE_URL\" -e REDIS_URL=\"redis://assignment-redis:6379/0\" 003344631245.dkr.ecr.us-east-1.amazonaws.com/assignment-portal-backend:latest"
          ]'

      - echo "==========================================="
      - echo "Creating imagedefinitions.json"
      - echo "==========================================="

      - printf '[{"name":"backend","imageUri":"%s"},{"name":"frontend","imageUri":"%s"}]' "$BACKEND_IMAGE_URI:$IMAGE_TAG" "$FRONTEND_IMAGE_URI:$IMAGE_TAG" > imagedefinitions.json

      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
