name: AWS Deployment (OIDC Debug)

on:
  push:
    branches:
      - AWS-OCID

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to AWS using OIDC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      #########################################################
      # Print GitHub Context
      #########################################################
      - name: Print GitHub Context
        run: |
          echo "Repository      : ${{ github.repository }}"
          echo "Repository Owner: ${{ github.repository_owner }}"
          echo "Branch          : ${{ github.ref_name }}"
          echo "Ref             : ${{ github.ref }}"
          echo "Event           : ${{ github.event_name }}"
          echo "Actor           : ${{ github.actor }}"
          echo "Workflow        : ${{ github.workflow }}"

      #########################################################
      # Request OIDC Token
      #########################################################
      - name: Get OIDC Token
        id: idtoken
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            core.setOutput("jwt", token);

      #########################################################
      # Decode JWT Payload (Safe)
      #########################################################
      - name: Decode JWT Payload
        env:
          JWT: ${{ steps.idtoken.outputs.jwt }}
        run: |
          python3 <<'EOF'
          import os
          import json
          import base64

          token = os.environ["JWT"]

          payload = token.split(".")[1]

          payload += "=" * (-len(payload) % 4)

          decoded = json.loads(
              base64.urlsafe_b64decode(payload).decode()
          )

          print("========== JWT PAYLOAD ==========")
          print(json.dumps(decoded, indent=2))
          print("=================================")
          EOF

      #########################################################
      # Configure AWS Credentials
      #########################################################
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      #########################################################
      # Verify Authentication
      #########################################################
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      #########################################################
      # List S3 Buckets
      #########################################################
      - name: Test AWS Access
        run: |
          aws s3 ls
