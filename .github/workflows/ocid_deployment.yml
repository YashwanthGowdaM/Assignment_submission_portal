name: Scan, Build Images & Update K8s Manifests

on:
  push:
    branches:
      - K8sDeploymentWithSonarQubeAndTrivia
    paths:
      - "backend/**"
      - "frontend/**"
      - "database/**"
      - "migrations/**"
      - "tests/**"
      - "requirements.txt"
      - "alembic.ini"
      - "entrypoint.sh"
      - "seed.py"
      - "sonar-project.properties"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

  BACKEND_ECR_REPOSITORY: assignment-portal-backend
  FRONTEND_ECR_REPOSITORY: assignment-portal-frontend

  MANIFEST_REPO: YashwanthGowdaM/assignment-portal-k8s
  MANIFEST_BRANCH: main

  # Trivy is run from its official container image, pinned to an exact version.
  # (We avoid the aquasecurity/trivy-action GitHub Action: its version tags were
  #  hijacked in March 2026.) Check https://github.com/aquasecurity/trivy/releases
  #  and bump this when you want a newer scanner.
  TRIVY_VERSION: "0.74.0"

jobs:
  #############################################################
  # JOB 1: SonarQube code scan (never blocks the pipeline)
  #############################################################
  sonarqube:
    name: SonarQube Code Scan
    runs-on: ubuntu-latest
    continue-on-error: true   # DEMO MODE: a Sonar problem will not stop deployment

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history gives Sonar better blame/new-code info

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests with coverage
        continue-on-error: true   # coverage is a bonus; scan still runs if tests fail
        run: |
          pip install -r backend/requirements.txt pytest-cov
          PYTHONPATH=backend pytest tests \
            --cov=backend/app \
            --cov-report=xml:coverage.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  #############################################################
  # JOB 2: Build -> Trivy scan -> Push -> Update manifests
  #############################################################
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: sonarqube   # runs after the scan; still runs if the scan job failed (see continue-on-error above)

    steps:

      #########################################################
      # Checkout Application Repository
      #########################################################

      - name: Checkout Source Repository
        uses: actions/checkout@v4

      #########################################################
      # Configure AWS Credentials (OIDC)
      #########################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_SNQ }}
          aws-region: ${{ env.AWS_REGION }}

      #########################################################
      # Login to Amazon ECR
      #########################################################

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      #########################################################
      # Build Images (nothing is pushed yet)
      #########################################################

      - name: Build Backend Docker Image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t $BACKEND_ECR_REPOSITORY:${{ github.sha }} \
            .

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t $FRONTEND_ECR_REPOSITORY:${{ github.sha }} \
            ./frontend

      #########################################################
      # Trivy Image Scan (report only - exit-code 0 never fails the build)
      #########################################################

      - name: Trivy Scan - Backend Image
        run: |
          mkdir -p trivy-reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/trivy-reports:/reports" \
            -e TRIVY_DB_REPOSITORY=public.ecr.aws/aquasecurity/trivy-db:2 \
            public.ecr.aws/aquasecurity/trivy:${TRIVY_VERSION} image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 0 \
              --format table \
              --output /reports/backend.txt \
              $BACKEND_ECR_REPOSITORY:${{ github.sha }}

      - name: Trivy Scan - Frontend Image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/trivy-reports:/reports" \
            -e TRIVY_DB_REPOSITORY=public.ecr.aws/aquasecurity/trivy-db:2 \
            public.ecr.aws/aquasecurity/trivy:${TRIVY_VERSION} image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 0 \
              --format table \
              --output /reports/frontend.txt \
              $FRONTEND_ECR_REPOSITORY:${{ github.sha }}

      - name: Show Trivy Results
        run: |
          {
            echo "## Trivy - Backend image"
            echo '```'
            cat trivy-reports/backend.txt
            echo '```'
            echo "## Trivy - Frontend image"
            echo '```'
            cat trivy-reports/frontend.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-reports/

      #########################################################
      # Tag & Push (same as before)
      #########################################################

      - name: Tag Backend Image
        run: |
          docker tag \
          $BACKEND_ECR_REPOSITORY:${{ github.sha }} \
          ${{ steps.login-ecr.outputs.registry }}/$BACKEND_ECR_REPOSITORY:${{ github.sha }}

      - name: Push Backend Image
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/$BACKEND_ECR_REPOSITORY:${{ github.sha }}

      - name: Tag Frontend Image
        run: |
          docker tag \
          $FRONTEND_ECR_REPOSITORY:${{ github.sha }} \
          ${{ steps.login-ecr.outputs.registry }}/$FRONTEND_ECR_REPOSITORY:${{ github.sha }}

      - name: Push Frontend Image
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/$FRONTEND_ECR_REPOSITORY:${{ github.sha }}

      #########################################################
      # Clone Manifest Repository
      #########################################################

      - name: Clone Manifest Repository
        run: |
          git clone \
          https://x-access-token:${{ secrets.K8S_REPO_PAT }}@github.com/${{ env.MANIFEST_REPO }}.git

      #########################################################
      # Update Backend Deployment
      #########################################################

      - name: Update Backend Deployment Image
        run: |
          sed -i "s|image: .*assignment-portal-backend:.*|image: 003344631245.dkr.ecr.${AWS_REGION}.amazonaws.com/${BACKEND_ECR_REPOSITORY}:${{ github.sha }}|g" \
          assignment-portal-k8s/manifest_files/backend/deployment.yaml

      #########################################################
      # Update Frontend Deployment
      #########################################################

      - name: Update Frontend Deployment Image
        run: |
          sed -i "s|image: .*assignment-portal-frontend:.*|image: 003344631245.dkr.ecr.${AWS_REGION}.amazonaws.com/${FRONTEND_ECR_REPOSITORY}:${{ github.sha }}|g" \
          assignment-portal-k8s/manifest_files/frontend/deployment.yaml

      #########################################################
      # Commit Changes
      #########################################################

      - name: Commit Manifest Changes
        run: |
          cd assignment-portal-k8s

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout ${MANIFEST_BRANCH}

          git add manifest_files/backend/deployment.yaml
          git add manifest_files/frontend/deployment.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes."
            exit 0
          fi

          git commit -m "Update images to ${{ github.sha }}"

      #########################################################
      # Push Changes
      #########################################################

      - name: Push Manifest Changes
        run: |
          cd assignment-portal-k8s
          git push origin ${MANIFEST_BRANCH}
