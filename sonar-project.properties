# SonarQube project settings (demo-friendly: light exclusions, no strict rules)
sonar.projectKey=Assignment_submission_portal
sonar.projectName=Assignment Submission Portal

# What to scan
sonar.sources=backend,frontend,src,seed.py
sonar.tests=tests
sonar.python.version=3.12

# Skip things that are not hand-written code
sonar.exclusions=**/node_modules/**,**/*.png,**/*.min.js,database/migrations/**

# Coverage report produced by pytest in the workflow (optional - ignored if missing)
sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8
