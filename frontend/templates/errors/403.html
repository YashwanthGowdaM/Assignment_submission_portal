{% extends "base.html" %}

{% block title %}403 - Forbidden{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card-portal p-5 mx-auto" style="max-width: 540px;">
        <i class="bi bi-shield-slash text-danger display-1 mb-3"></i>
        <h1 class="h3 fw-bold mb-2">Access Denied</h1>
        <p class="text-muted mb-4">You do not have the authorization level required to view or perform operations on this resource.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4">
            <i class="bi bi-arrow-left me-1"></i> Return to Safe Area
        </a>
    </div>
</div>
{% endblock %}
