{% extends "base.html" %}

{% block title %}400 - Bad Request{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card-portal p-5 mx-auto" style="max-width: 540px;">
        <i class="bi bi-shield-exclamation text-warning display-1 mb-3"></i>
        <h1 class="h3 fw-bold mb-2">Invalid Request Parameters</h1>
        <p class="text-muted mb-4">The submitted form data or URL arguments failed validation checks or CSRF verification.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4">
            <i class="bi bi-house-door me-1"></i> Return to Safety
        </a>
    </div>
</div>
{% endblock %}
