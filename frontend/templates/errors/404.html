{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card-portal p-5 mx-auto" style="max-width: 540px;">
        <i class="bi bi-compass text-warning display-1 mb-3"></i>
        <h1 class="h3 fw-bold mb-2">Resource Not Found</h1>
        <p class="text-muted mb-4">The assignment, team group, or endpoint you requested does not exist or may have been archived.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4">
            <i class="bi bi-house-door me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
